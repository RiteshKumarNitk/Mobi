# Production-like local setup: PostgreSQL for the Baba Communication platform.
# Start with: docker compose up -d
# Then set DATABASE_URL in apps/api/.env to:
#   postgresql://baba:baba@localhost:5432/baba?schema=public
# and switch prisma/schema.prisma provider to "postgresql".

services:
  db:
    image: postgres:16-alpine
    container_name: baba-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: baba
      POSTGRES_PASSWORD: baba
      POSTGRES_DB: baba
    ports:
      - "5432:5432"
    volumes:
      - baba_pgdata:/var/lib/postgresql/data

volumes:
  baba_pgdata:
